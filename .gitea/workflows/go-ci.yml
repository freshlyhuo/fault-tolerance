name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: "0"
      GOPROXY: "https://goproxy.cn,direct"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: false

      - name: Download dependencies
        run: |
          go mod download
          cd fault-diagnosis && go mod download
          cd ../health-monitor && go mod download

      - name: Test root module packages
        run: go test ./cmd/... ./pkg/... ./fault-recovery/...

      - name: Test fault-diagnosis module
        working-directory: fault-diagnosis
        run: go test ./...

      - name: Test health-monitor module
        working-directory: health-monitor
        run: go test ./...
